version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meuguia
      POSTGRES_USER: meuguia
      POSTGRES_PASSWORD: meuguia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuguia -d meuguia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
